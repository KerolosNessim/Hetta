# Supabase free projects pause after ~7 days without activity.
# This pings the database twice a week so the project stays awake.
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 9 * * 1,4" # Monday and Thursday, 09:00 UTC
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the settings table
        run: |
          curl --fail --silent --show-error --retry 3 \
            "${{ secrets.SUPABASE_URL }}/rest/v1/settings?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
